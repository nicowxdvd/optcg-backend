x-api-base: &api-base
  build: .
  image: optcg-api
  env_file: .env
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
    DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    REDIS_URL: redis://redis:6379
services:
  redis:
    image: redis:7-alpine
    container_name: optcg-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: optcg-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *api-base
    container_name: optcg-migrate
    command: ["npm", "run", "migration:run:prod"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-base
    container_name: optcg-api
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/docs"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  redis-data:
  mysql-data:
